services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "7833:6333"   # HTTP + web dashboard  → http://localhost:7833/dashboard
      - "7834:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build: .
    container_name: rag-api
    ports:
      - "7799:7799"
    env_file: .env
    environment:
      # inside the compose network the DB is a hostname, not a mapped port
      QDRANT_URL: http://qdrant:6333
      # A container cannot see your `az login`, so the default here is key auth —
      # which is enough for chat and embeddings, but NOT for the Agent Service or
      # the control plane, both of which require Microsoft Entra.
      #
      # To get a real identity in the container, give it a service principal
      # (AZURE_CLIENT_ID / AZURE_CLIENT_SECRET / AZURE_TENANT_ID in .env — env_file
      # passes them through) and set DOCKER_AZURE_AI_AUTH=identity in .env.
      # DefaultAzureCredential tries EnvironmentCredential first, so nothing else
      # changes. Deployed to Azure, the same code uses a managed identity instead
      # and needs no secret at all.
      AZURE_AI_AUTH: ${DOCKER_AZURE_AI_AUTH:-key}
      # uncomment to reach LM Studio running on the HOST from inside the container:
      # LMSTUDIO_BASE_URL: http://host.docker.internal:1234/v1
    volumes:
      - ./app:/srv/app          # live reload: edit locally, uvicorn restarts in-container
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"   # makes host LM Studio reachable on Linux too

  console:
    build: ../frontend
    container_name: rag-console
    ports:
      - "7800:7800"
    environment:
      # inside the compose network the API is a hostname, not localhost.
      # docker-compose.host-api.yml points this at the host instead.
      VITE_API_TARGET: http://api:7799
    volumes:
      - ../frontend/src:/srv/src              # live reload: edit locally, HMR in the browser
      - ../frontend/index.html:/srv/index.html
      - ../frontend/vite.config.js:/srv/vite.config.js   # proxy routes, without a rebuild
    depends_on:
      - api
    extra_hosts:
      # "the machine running Docker" — unused in this lane, required by the host-api one
      - "host.docker.internal:host-gateway"

volumes:
  qdrant-data:
